# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
# ║                         ADARYUS R. GILLUM - ULTIMATE README AUTO-UPDATER                                                                            ║
# ║              Comprehensive workflow that updates all dynamic content every 6 hours                                                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════

name: 🔥 Ultimate README Auto-Updater

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  
  # Run on every push to main
  push:
    branches: [ main ]
  
  # Allow manual trigger
  workflow_dispatch:

# Permissions needed for the workflow
permissions:
  contents: write
  actions: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 1: Update README Stats
  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  update-readme-stats:
    name: 📊 Update README Statistics
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 📦 Install Dependencies
        run: |
          npm install axios moment

      - name: 🔥 Fetch Live Stats & Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/update-readme.js

      - name: 💾 Commit Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "🔥 Auto-update: Refresh dynamic stats [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push
            echo "✅ Changes committed and pushed!"
          fi

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 2: Generate Snake Animations
  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  generate-snakes:
    name: 🐍 Generate Snake Animations
    runs-on: ubuntu-latest
    needs: update-readme-stats
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Generate Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=DC143C&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: 🎨 Generate Letter-by-Letter Snake
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: pip install svgwrite

      - name: 📝 Create Letter Snake
        run: python .github/scripts/generate-letter-snake.py

      - name: 🚀 Deploy Snakes to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 3: Update Activity & Achievements
  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  update-activity:
    name: 📈 Update Activity Feed
    runs-on: ubuntu-latest
    needs: update-readme-stats
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: pip install requests

      - name: 🔥 Update Activity Feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update-activity.py

      - name: 💾 Commit Activity Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "📈 Update activity feed [$(date +'%Y-%m-%d %H:%M:%S')]" || exit 0
          git push || echo "No push needed"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 4: Generate 3D Contribution Chart
  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  generate-3d-contrib:
    name: 🗼 Generate 3D Contribution Chart
    runs-on: ubuntu-latest
    needs: generate-snakes
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🗼 Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        with:
          username: ${{ github.repository_owner }}

      - name: 💾 Commit 3D Chart
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "ℹ️ No 3D chart changes"
          else
            git commit -m "🗼 Update 3D contribution chart [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push
            echo "✅ 3D chart updated!"
          fi

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 5: Generate Advanced Metrics
  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  generate-metrics:
    name: 📊 Generate Advanced Metrics
    runs-on: ubuntu-latest
    needs: [update-readme-stats, generate-snakes]
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔥 Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          config_output: svg
          filename: github-metrics.svg
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_repositories: yes
          plugin_repositories_featured: adaryusrgillum/adaryusrgillum
          plugin_stars: yes
          plugin_stars_limit: 4

      - name: 💾 Commit Metrics
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add github-metrics.svg || true
          git diff --cached --quiet || git commit -m "📊 Update advanced metrics [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push || echo "No push needed"
